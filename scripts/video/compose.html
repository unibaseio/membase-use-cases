<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --blue: #3e61ff; --ink: #0f172b; --body: #54637a; --line: #d9dfea; --surface: #f2f5fa;
    --panel: #3e61ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--ink); }
  .stage { position: absolute; inset: 0; overflow: hidden; background: var(--surface); }

  /* the field: membase.ai's glow and hatched clouds, in place of EverOS's oil paint */
  .field { position: absolute; inset: 0; background: #f6f8fd; }
  .field .glow { position: absolute; left: 50%; top: 46%; width: 2200px; height: 1150px; transform: translate(-50%, -50%);
    background: url(assets/glow.png) center / 100% 100% no-repeat; opacity: .55; }
  .field .clouds { position: absolute; left: -2%; right: -2%; bottom: -60px; height: 760px;
    background: url(assets/clouds.jpg) center bottom / cover no-repeat; mix-blend-mode: multiply; opacity: .9; }

  /* the browser window holding the recording */
  .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }  /* no will-change: it would raster the 2x frame small, then blur it up */
  .window { position: absolute; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 80px rgba(15, 23, 43, .22), 0 2px 6px rgba(15, 23, 43, .12), 0 0 0 1px rgba(15, 23, 43, .08); }
  .chrome { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #eef1f6; border-bottom: 1px solid #dde2ea; }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .url { flex: 0 1 520px; margin: 0 auto; height: 28px; border-radius: 8px; background: #fff; border: 1px solid #dde2ea;
    font: 500 14px 'Instrument Sans'; color: #6b7487; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .url b { color: var(--ink); font-weight: 600; }
  .shot { display: block; width: 100%; background: #f7f7f5; }
  /* the spotlight: a ring round what matters, the rest of the page dimmed */
  .spot { position: absolute; border-radius: 12px; border: 3px solid var(--blue); pointer-events: none;
    box-shadow: 0 0 0 4000px rgba(15, 23, 43, .18), 0 0 24px rgba(62, 97, 255, .30); }

  /* step label, bottom centre */
  .step { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px;
    padding: 14px 28px 14px 14px; border-radius: 999px; background: rgba(255, 255, 255, .94);
    box-shadow: 0 10px 30px rgba(15, 23, 43, .14), 0 0 0 1px rgba(62, 97, 255, .14); white-space: nowrap;
    transition: none; }
  .step .n { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff;
    font: 700 22px 'Bricolage Grotesque'; display: grid; place-items: center; }
  .step .t { font: 700 30px 'Bricolage Grotesque'; letter-spacing: -.01em; }
  .step .d { font: 500 22px 'Instrument Sans'; color: var(--body); }

  /* a sped-up wait, top right: honest about time */
  .wait { position: absolute; right: 40px; top: 34px; display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    border-radius: 12px; background: var(--ink); color: #fff; font: 600 20px 'Instrument Sans';
    box-shadow: 0 8px 24px rgba(15, 23, 43, .25); }
  .wait .ff { color: #9fb2ff; font-size: 22px; }
  .wait .x { color: #9fb2ff; font-weight: 500; }

  .corner { position: absolute; left: 32px; top: 28px; display: flex; align-items: center; gap: 12px; padding: 9px 16px;
    border-radius: 12px; background: rgba(255, 255, 255, .92); box-shadow: 0 4px 16px rgba(15, 23, 43, .08), 0 0 0 1px rgba(15, 23, 43, .06);
    font: 600 18px 'Instrument Sans'; color: var(--body); }
  .corner img { height: 26px; }
  .corner .sep { width: 1px; height: 18px; background: var(--line); }

  /* intro: the banner layout at full frame */
  .intro { position: absolute; inset: 0; display: grid; grid-template-columns: 50% 50%; will-change: transform; }
  .intro .left { background: var(--panel); color: #fff; padding: 0 110px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
  .intro .kick { font: 600 22px 'Instrument Sans'; letter-spacing: .08em; text-transform: uppercase; opacity: .78; }
  .intro h1 { font: 700 92px/1.02 'Bricolage Grotesque'; letter-spacing: -.025em; }
  .intro p { font: 400 34px/1.42 'Instrument Sans'; opacity: .92; max-width: 760px; }
  .intro .base { align-self: flex-start; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.16);
    font: 600 20px 'Instrument Sans'; }
  .intro .right { position: relative; overflow: hidden; }
  #iWin { width: 1180px; left: 120px; top: 190px; }
  .intro.short #iWin { width: 1080px; left: 36px; top: 172px; }

  /* outro */
  .outro { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(246, 248, 253, .97); }
  .outro .card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .outro img { height: 44px; }
  .outro h2 { font: 700 76px/1.05 'Bricolage Grotesque'; letter-spacing: -.02em; }
  .outro p { font: 400 32px 'Instrument Sans'; color: var(--body); max-width: 1100px; }
  .outro .chips { display: flex; gap: 14px; }
  .outro .chip { padding: 10px 20px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font: 600 22px 'Instrument Sans'; }
  .outro .chip.blue { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* banner: 1300x553, the README card */
  .banner { position: absolute; left: 0; top: 0; width: 1300px; height: 553px; display: grid; grid-template-columns: 52% 48%; overflow: hidden; }
  .banner .left { background: var(--panel); color: #fff; padding: 0 60px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .banner h1 { font: 700 54px/1.05 'Bricolage Grotesque'; letter-spacing: -.02em; }
  .banner p { font: 400 25px/1.42 'Instrument Sans'; opacity: .93; }
  .banner .tag { font: 600 15px 'Instrument Sans'; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .banner .right { position: relative; overflow: hidden; }

  /* architecture card: the chain behind the demo, nodes appearing one by one */
  .archcard { position: absolute; inset: 0; background: rgba(246, 248, 253, .97); display: grid; place-items: center; }
  .archcard .wrap { width: 1640px; display: grid; gap: 34px; }
  .archcard .kick { font: 600 22px 'Instrument Sans'; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
  .archcard h2 { font: 700 54px/1.1 'Bricolage Grotesque'; letter-spacing: -.02em; margin: -18px 0 0; }
  .archcard .chain { display: flex; align-items: stretch; gap: 18px; }
  .archcard .node { flex: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 22px 24px; display: grid; gap: 8px; align-content: start;
    box-shadow: 0 10px 30px rgba(15, 23, 43, .06); }
  .archcard .node.mb { border-color: var(--blue); background: #f2f5ff; }
  .archcard .node b { font: 700 26px 'Bricolage Grotesque'; }
  .archcard .node span { font: 400 21px/1.4 'Instrument Sans'; color: var(--body); }
  .archcard .arrow { align-self: center; font: 600 34px 'Instrument Sans'; color: var(--blue); }
  .archcard .foot { font: 400 24px/1.4 'Instrument Sans'; color: var(--body); }

  /* intro, short form (META "line"): a big title, one line, and a product shot you can read */
  .intro.short { grid-template-columns: 40% 60%; }
  .intro.short .left { padding: 0 84px 0 96px; gap: 30px; }
  .intro.short h1 { font-size: 100px; line-height: 1; }
  .intro.short p { font: 500 40px/1.3 'Instrument Sans'; opacity: .95; max-width: 640px; }
  .intro.short .base { font-size: 24px; padding: 10px 22px; }

  /* the explainer (META "explain"): actors, arrows, tokens that move along them, and Membase
     showing what it does inside at each beat */
  .explain { position: absolute; inset: 0; overflow: hidden; }
  .explain > .field .clouds { opacity: .55; }
  .xhead { position: absolute; left: 96px; top: 64px; display: grid; gap: 10px; }
  .xhead .kick { font: 600 24px 'Instrument Sans'; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
  .xhead h2 { font: 700 64px/1.05 'Bricolage Grotesque'; letter-spacing: -.025em; }
  .xhead .foot { font: 500 30px 'Instrument Sans'; color: var(--body); }
  .xarrows { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .xarrows path.arrow { fill: none; stroke: #9aa8c4; stroke-width: 4; stroke-dasharray: 2 11; stroke-linecap: round; }
  .xarrows path.arrow.on { stroke: var(--blue); stroke-width: 6; stroke-dasharray: none; }
  .xarrows path.arrow.dark { stroke: #8a7f6c; }
  .xarrows path.arrow.dark.on { stroke: #7f9bff; }
  .xlayer, .xtokens { position: absolute; inset: 0; }
  .xframe { position: absolute; border-radius: 30px; background: var(--tint, #fff); color: var(--ink2, var(--ink));
    box-shadow: 0 30px 70px rgba(15, 23, 43, .22), 0 0 0 1px rgba(15, 23, 43, .1); }
  .xframe .xframe-h { position: absolute; left: 30px; top: 22px; display: flex; align-items: center; gap: 14px;
    font: 700 32px 'Bricolage Grotesque'; }
  .xframe .xframe-h svg { width: 40px; height: 40px; }
  .xnode { position: absolute; width: 0; height: 0; --r: 84px; }
  .xnode .disc { position: absolute; left: calc(-1 * var(--r)); top: calc(-1 * var(--r)); width: calc(2 * var(--r)); height: calc(2 * var(--r)); border-radius: 50%;
    display: grid; place-items: center; background: var(--tint, #fff); color: var(--ink2, var(--ink));
    box-shadow: 0 16px 40px rgba(15, 23, 43, .16), 0 0 0 2px rgba(15, 23, 43, .08); }
  .xnode.app .disc { border-radius: 40px; }
  .xnode .disc > svg { width: 96px; height: 96px; }
  .xnode.art .disc { overflow: hidden; background: var(--tint, #e9dcbf); box-shadow: 0 16px 40px rgba(0, 0, 0, .35), 0 0 0 5px var(--ring, #e2b25c); }
  .xnode.art .disc > svg { width: 100%; height: 100%; }
  .xnode .disc::after { content: ''; position: absolute; inset: -12px; border-radius: inherit; border: 5px solid var(--blue); opacity: 0; }
  .xnode.app .disc::after { border-radius: 50px; }
  .xnode.on .disc::after { opacity: 1; }
  .xnode .lab { position: absolute; white-space: nowrap; font: 700 34px 'Bricolage Grotesque'; letter-spacing: -.01em; color: var(--labc, var(--ink)); }
  .xnode .lab.below { left: 0; top: calc(var(--r) + 18px); transform: translateX(-50%); }
  .xnode .lab.above { left: 0; bottom: calc(var(--r) + 18px); transform: translateX(-50%); }
  .xnode .lab.right { left: calc(var(--r) + 24px); top: 0; transform: translateY(-50%); }
  .xnode .lab.left { right: calc(var(--r) + 24px); top: 0; transform: translateY(-50%); }
  .xnode .lab.plate { left: 0; top: calc(var(--r) - 26px); transform: translateX(-50%); padding: 4px 18px; border-radius: 6px; font: 700 28px 'Bricolage Grotesque';
    background: var(--ring, var(--ink)); color: #fbf3e2; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); }
  .xnode .lab.none { display: none; }
  .xnode .disc .lab.inside { position: static; font-size: 32px; color: inherit; }
  .xnode .disc:has(.inside) { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding-top: 8px; }
  .xnode .disc:has(.inside) ~ .results { top: calc(var(--r) + 20px); }
  .xnode .results { position: absolute; display: grid; gap: 10px; justify-items: center; left: 0; top: calc(var(--r) + 72px); transform: translateX(-50%); }
  .xnode .lab.right ~ .results { left: calc(var(--r) + 24px); top: 34px; transform: none; justify-items: start; }
  .xnode .lab.left ~ .results { left: auto; right: calc(var(--r) + 24px); top: 34px; transform: none; justify-items: end; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px 10px 14px; border-radius: 999px; white-space: nowrap;
    font: 700 28px 'Instrument Sans'; background: #fff; color: var(--ink); box-shadow: 0 8px 22px rgba(15, 23, 43, .16), 0 0 0 1px rgba(15, 23, 43, .08); }
  .chip svg { width: 30px; height: 30px; flex: none; }
  .chip.ok svg { color: #fff; background: #16a34a; border-radius: 50%; padding: 4px; }
  .chip.no svg { color: #fff; background: #dc2626; border-radius: 50%; padding: 4px; }
  .chip.no { color: #7a1d1d; }
  .chip.key { background: var(--ink); color: #fff; font-size: 26px; }
  .chip.key svg { color: #f4c734; }

  .xmb { position: absolute; border-radius: 32px; color: #fff;
    background: linear-gradient(160deg, #4a6cff 0%, #3e61ff 45%, #2c48d8 100%);
    box-shadow: 0 30px 80px rgba(62, 97, 255, .35), 0 0 0 1px rgba(255, 255, 255, .25) inset; }
  .xmb.on { box-shadow: 0 30px 90px rgba(62, 97, 255, .55), 0 0 0 6px rgba(62, 97, 255, .28); }
  .xmb .tab { position: absolute; left: 28px; top: -26px; display: flex; align-items: center; gap: 10px; padding: 8px 20px 8px 14px;
    border-radius: 14px; background: var(--ink); color: #fff; font: 700 26px 'Instrument Sans'; box-shadow: 0 8px 20px rgba(15, 23, 43, .25); }
  .xmb .tab svg { width: 32px; height: 32px; color: #9fb2ff; }
  .xmb .head { display: flex; align-items: center; gap: 14px; padding: 34px 30px 18px; }
  .xmb .head img { width: 50px; height: 50px; }
  .xmb .head b { font: 700 40px 'Bricolage Grotesque'; letter-spacing: -.02em; }
  .xmb .head .pills { margin-left: auto; display: flex; gap: 10px; }
  .xmb .pill { display: flex; align-items: center; gap: 8px; padding: 8px 18px 8px 12px; border-radius: 999px; font: 700 26px 'Instrument Sans';
    background: rgba(255, 255, 255, .12); color: rgba(255, 255, 255, .55); }
  .xmb .pill svg { width: 28px; height: 28px; }
  .xmb .pill.on { background: #fff; color: var(--blue); box-shadow: 0 0 0 6px rgba(255, 255, 255, .25); }
  .xmb .body { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-direction: column; }
  .xmb .folder { flex: 1; display: flex; flex-direction: column; border-radius: 0 18px 18px 18px; background: rgba(15, 23, 43, .22); padding: 16px; position: relative; }
  .xmb .folder .ftab { position: absolute; left: 0; top: -40px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px;
    border-radius: 14px 14px 0 0; background: rgba(15, 23, 43, .22); font: 600 24px 'Instrument Sans'; color: rgba(255, 255, 255, .9); }
  .xmb .folder .ftab svg { width: 26px; height: 26px; }
  .xmb .slots { flex: 1; display: flex; gap: 16px; }
  .xmb.stack .slots { flex-direction: column; }
  .xmb.stack .xslot { flex-direction: row; align-items: center; gap: 18px; padding: 0 20px; }
  .xmb.stack .xslot .sh { width: 250px; flex: none; }
  .xmb.stack .xslot .rows { flex-direction: row; flex: 1; }
  .xslot { flex: 1; position: relative; border-radius: 18px; background: rgba(255, 255, 255, .13); border: 2px solid rgba(255, 255, 255, .28);
    padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .xslot.on { border-color: #fff; background: rgba(255, 255, 255, .2); }
  .xslot .sh { display: flex; align-items: center; gap: 12px; font: 700 28px 'Instrument Sans'; }
  .xslot .sh .face { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #e9dcbf; box-shadow: 0 0 0 3px rgba(255, 255, 255, .7); flex: none; }
  .xslot .sh .face svg { width: 100%; height: 100%; display: block; }
  .xslot .sh > svg { width: 34px; height: 34px; }
  .xslot .rows { display: flex; flex-direction: column; gap: 10px; }
  .xslot .row { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px 0 12px; border-radius: 12px; background: #fff; color: var(--ink);
    font: 600 27px 'Instrument Sans'; transform-origin: 0 50%; white-space: nowrap; box-shadow: 0 4px 12px rgba(15, 23, 43, .14); }
  .xslot .row svg { width: 28px; height: 28px; color: var(--blue); flex: none; }
  .xslot .row i { display: block; height: 14px; border-radius: 7px; background: #c9d2e6; }
  .xslot .row.hit { background: #fbe08a; box-shadow: 0 0 0 4px #f4c734, 0 10px 26px rgba(15, 23, 43, .25); }
  .xslot .row.hit i { background: #d7a92a; }
  .xslot .row.gone { background: #fde8e8; color: #9b1c1c; box-shadow: 0 0 0 4px #f29b9b; text-decoration: line-through 3px; }
  .xslot .row.gone svg { color: #dc2626; }
  .xslot .row.gone i { background: #f29b9b; }
  .xslot .empty { font: italic 500 27px 'Instrument Sans'; color: rgba(255, 255, 255, .6); padding: 8px 4px; }
  .xslot .fx { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
  .xslot .fx .chip { position: absolute; left: 50%; }
  .xslot .fx .lens { position: absolute; left: 50%; width: 76px; height: 76px; margin-left: -38px; border-radius: 50%; background: #fff; color: var(--blue);
    display: grid; place-items: center; box-shadow: 0 10px 26px rgba(15, 23, 43, .3), 0 0 0 6px rgba(255, 255, 255, .3); }
  .xslot .fx .lens svg { width: 44px; height: 44px; }
  .xslot .fx .scan { position: absolute; left: 8px; right: 8px; height: 6px; border-radius: 3px; background: #fff; box-shadow: 0 0 22px 6px rgba(255, 255, 255, .55); }

  .xtok { position: absolute; left: 0; top: 0; }
  .xtok .chip { transform: translate(-50%, -50%); border: 4px solid var(--blue); padding: 10px 22px 10px 16px; font-size: 30px; }
  .xtok .chip svg { color: var(--blue); width: 32px; height: 32px; }
  .xtok .chip.hit { background: #fbe08a; border-color: #e0ad1f; }
  .xtok .chip.hit svg { color: #8a6400; }
  .xtok .chip.none { background: #eef1f6; border-color: #9aa8c4; color: #54637a; }
  .xtok .chip.none svg { color: #54637a; }
  .xkey { position: absolute; transform: translate(-50%, -50%); }
  .xkey .chip { background: var(--ink); color: #fff; font-size: 26px; }
  .xkey .chip svg { color: #f4c734; }
  .xcap { position: absolute; left: 50%; bottom: 44px; display: flex; align-items: center; gap: 20px; padding: 16px 40px 16px 16px; border-radius: 999px;
    background: #fff; white-space: nowrap; box-shadow: 0 14px 40px rgba(15, 23, 43, .16), 0 0 0 1px rgba(62, 97, 255, .16); }
  .xcap .n { width: 64px; height: 64px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 34px 'Bricolage Grotesque'; display: grid; place-items: center; }
  .xcap .t { font: 700 48px 'Bricolage Grotesque'; letter-spacing: -.015em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="field"><div class="glow"></div><div class="clouds"></div></div>
  <div class="cam" id="cam">
    <div class="window" id="win">
      <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="url" id="url"></div><div style="width:52px"></div></div>
      <img class="shot" id="shot">
      <div class="spot" id="spot" hidden></div>
    </div>
  </div>
  <div class="corner" id="corner"><img src="assets/membase-logo.svg"><span class="sep"></span><span id="cornerText"></span></div>
  <div class="wait" id="wait" hidden><span class="ff">⏩</span><span id="waitText"></span><span class="x" id="waitX"></span></div>
  <div class="step" id="step" hidden><span class="n" id="stepN"></span><span class="t" id="stepT"></span><span class="d" id="stepD"></span></div>
  <div class="intro" id="intro" hidden>
    <div class="left"><div class="kick" id="iKick"></div><h1 id="iTitle"></h1><p id="iPitch"></p><div class="base" id="iBase"></div></div>
    <div class="right"><div class="field"><div class="glow"></div><div class="clouds"></div></div>
      <div class="window" id="iWin">
        <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="url" id="iUrl"></div><div style="width:52px"></div></div>
        <img class="shot" id="iShot">
      </div>
    </div>
  </div>
  <div class="archcard" id="arch" hidden><div class="wrap">
    <div class="kick" id="archKick"></div><h2 id="archTitle"></h2>
    <div class="chain" id="archChain"></div><div class="foot" id="archFoot"></div></div></div>
  <div class="explain" id="explain" hidden></div>
  <div class="outro" id="outro" hidden>
    <div class="card"><img src="assets/membase-logo.svg"><h2 id="oTitle"></h2><p id="oPitch"></p>
      <div class="chips"><span class="chip blue" id="oBase"></span><span class="chip">github.com/unibaseio/membase-use-cases</span></div></div>
  </div>
</div>

<div class="banner" id="banner" hidden>
  <div class="left"><div class="tag" id="bTag"></div><h1 id="bTitle"></h1><p id="bPitch"></p></div>
  <div class="right"><div class="field"><div class="glow"></div><div class="clouds"></div></div>
    <div class="window" style="width:860px; left:70px; top:66px;">
      <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="url" id="bUrl"></div><div style="width:52px"></div></div>
      <img class="shot" id="bShot">
    </div>
  </div>
</div>

<script>
// Layout of the window on the stage at camera rest: the recording's CSS viewport scaled to fit.
const STAGE = { w: 1920, h: 1080 }, CHROME = 44;
let VIEW = { w: 1440, h: 900 };
const $ = (id) => document.getElementById(id);
const loaded = new Map();

function load(img, src) {
  if (!src) return Promise.resolve();
  if (img.dataset.src === src) return Promise.resolve();
  img.dataset.src = src;
  img.src = src;
  return img.decode().catch(() => {});
}

// Window size and position when the camera shows the whole page.
function rest() {
  const scale = Math.min((STAGE.w - 160) / VIEW.w, (STAGE.h - 184) / (VIEW.h + CHROME));
  const w = VIEW.w * scale, h = (VIEW.h + CHROME) * scale;
  return { scale, w, h, x: (STAGE.w - w) / 2, y: 64 };
}

// The camera: frame a box of the page (CSS px), or the whole page when box is null.
function camera(box) {
  const r = rest();
  if (!box) return { s: 1, tx: 0, ty: 0 };
  const bw = box[2] * r.scale, bh = box[3] * r.scale;
  // a gentle push-in only: the spotlight says where to look, so the camera never has to fill the frame
  const s = Math.max(1, Math.min(1.2, (STAGE.w * 0.92) / bw, (STAGE.h * 0.8) / bh));
  const cx = r.x + (box[0] + box[2] / 2) * r.scale, cy = r.y + (CHROME + box[1] + box[3] / 2) * r.scale;
  // put the box's centre a little above the stage centre, keeping room for the step label
  // keep the scaled window over the place it sits at rest: no zoom means no movement at all,
  // and a push-in can only pan within the margin it creates
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const tx = clamp(STAGE.w / 2 - cx * s, (r.x + r.w) * (1 - s), r.x * (1 - s));
  const ty = clamp(STAGE.h * 0.45 - cy * s, (r.y + r.h) * (1 - s), r.y * (1 - s));
  return { s, tx, ty };
}


// ---- the explainer ------------------------------------------------------------------------
// compose.py's plan_explain timed everything: beats [t0, t1], flows [t0, t1], Membase's inside
// step (learn or recall) [t0, t1]. Here: build the scene once per spec, then pose it at time t.
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const sm = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let XS = null;  // the built scene

function buildExplain(spec) {
  const root = $('explain');
  root.replaceChildren();
  root.append(el('div', 'field', '<div class="glow"></div><div class="clouds"></div>'));
  const head = el('div', 'xhead');
  head.append(el('div', 'kick', spec.kick || 'How Membase serves it'), el('h2', '', spec.title));
  if (spec.foot) head.append(el('div', 'foot', spec.foot));
  root.append(head);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'xarrows'); svg.setAttribute('viewBox', '0 0 1920 1080');
  svg.innerHTML = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa8c4"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8a7f6c"/></marker>
    <marker id="ahon" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3e61ff"/></marker>
    <marker id="ahond" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7f9bff"/></marker></defs>`;
  const layer = el('div', 'xlayer'), toks = el('div', 'xtokens');
  root.append(layer, svg, toks);
  const cap = el('div', 'xcap', '<span class="n"></span><span class="t"></span>');
  root.append(cap);

  const ui = spec.ui, nodes = {}, slots = {};
  const mb = spec.actors.find((a) => a.kind === 'membase');
  // default places: a row across the middle, Membase a card in its turn
  const row = spec.actors.filter((a) => !a.at && !a.box);
  row.forEach((a, i) => {
    const cx = 260 + (1400 * (i + 0.5)) / row.length;
    if (a.kind === 'membase') a.box = [cx - 330, 300, 660, 520]; else a.at = [cx, 540];
  });
  // frames first (an app that holds the rest), then Membase, then the nodes on top
  const rank = (a) => (a.kind === 'membase' ? 1 : a.box ? 0 : 2);
  const order = [...spec.actors].sort((a, b) => rank(a) - rank(b));
  for (const a of order) {
    const style = (e) => { if (a.tint) e.style.setProperty('--tint', a.tint); if (a.ink) e.style.setProperty('--ink2', a.ink); };
    if (a.kind === 'membase') {
      const [x, y, w, h] = a.box;
      const card = el('div', 'xmb' + (a.base === 'local' ? ' local' : '') + (a.stack ? ' stack' : ''));
      Object.assign(card.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      card.append(el('div', 'tab', (a.base === 'local' ? ui.cpu : ui.cloud) + `<span>${a.tab || (a.base === 'local' ? 'Local engine' : 'Hosted Membase')}</span>`));
      const hd = el('div', 'head', `<img src="assets/membase-logo-inverse.svg"><b>${a.label || 'Membase'}</b>`);
      const pills = el('span', 'pills');
      const pl = el('span', 'pill', ui.sparkles + 'learn'), pr = el('span', 'pill', ui.search + 'recall');
      pills.append(pl, pr);
      const pf = spec.beats.some((b) => b.inside && b.inside.kind === 'forget') ? el('span', 'pill', ui.eraser + 'forget') : null;
      if (pf) pills.append(pf);
      hd.append(pills); card.append(hd);
      const body = el('div', 'body');
      body.style.top = (a.folder ? 158 : 112) + 'px';
      const ss = el('div', 'slots');
      if (a.folder) {
        const f = el('div', 'folder'); f.append(el('div', 'ftab', ui.folder + `<span>${a.folder}</span>`), ss); body.append(f);
      } else body.append(ss);
      for (const s of a.slots) {
        const d = el('div', 'xslot');
        const face = s.face && spec.actors.find((b) => b.id === s.face);
        const sh = el('div', 'sh', (face ? `<span class="face">${face.svg}</span>` : (s.svg || '')) + `<span>${s.label}</span>`);
        const rows = el('div', 'rows'), fx = el('div', 'fx');
        d.append(sh, rows, fx); ss.append(d);
        slots[s.id] = { el: d, rows, fx, across: !!a.stack };
      }
      card.append(body); layer.append(card);
      nodes[a.id] = { a, el: card, ring: card, pills: { learn: pl, recall: pr, forget: pf } };
    } else if (a.box) {
      const [x, y, w, h] = a.box;
      const f = el('div', 'xframe', `<div class="xframe-h">${a.svg || ''}<span>${a.label}</span></div>`);
      Object.assign(f.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      style(f); layer.append(f);
      nodes[a.id] = { a, el: f, ring: f, frame: true };
    } else {
      // art (the demo's own drawing, or an inline <svg> with "fill") fills the disc
      const n = el('div', 'xnode ' + (a.kind || '') + (a.art || a.fill ? ' art' : ''));
      // a coordinate may name a Membase slot: the node sits level with it
      const at = a.at.map((v, i) => {
        if (typeof v === 'number') return v;
        const r = slots[v.split('.')[1]].el.getBoundingClientRect();
        return i ? r.top + r.height / 2 : r.left + r.width / 2;
      });
      n.style.left = at[0] + 'px'; n.style.top = at[1] + 'px';
      if (a.size) n.style.setProperty('--r', a.size / 2 + 'px');
      if (a.ring) n.style.setProperty('--ring', a.ring);
      if (a.labelColor) n.style.setProperty('--labc', a.labelColor);
      const disc = el('div', 'disc', a.svg || ''); style(disc);
      const res = el('div', 'results');
      const lab = el('div', 'lab ' + (a.labelAt || 'below'), a.label);
      if (a.labelAt === 'inside') disc.append(lab);  // an app tile: icon over name
      // the actor's own key to Membase, under its name
      if (a.key) res.append(el('span', 'chip key', ui['key-round'] + `<span>${a.key}</span>`));
      n.append(disc, ...(a.labelAt === 'inside' ? [] : [lab]), res);
      layer.append(n);
      nodes[a.id] = { a, el: n, ring: n, disc, res };
    }
  }
  // where an endpoint is on the stage: a node's disc, a Membase slot, or a frame
  const shape = (end, slot) => {
    if (slot != null) { const r = slots[slot].el.getBoundingClientRect(); return { r, round: false }; }
    const nd = nodes[end];
    const r = (nd.disc || nd.el).getBoundingClientRect();
    return { r, round: !!nd.disc && !nd.a.kind?.startsWith('app') };
  };
  const centre = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  // from c, heading d (unit), the point just outside the shape
  const exit = (sh, c, d, gap) => {
    if (sh.round) { const R = sh.r.width / 2 + gap; return { x: c.x + d.x * R, y: c.y + d.y * R }; }
    const r = sh.r, ts = [];
    if (d.x) ts.push(((d.x > 0 ? r.right : r.left) - c.x) / d.x);
    if (d.y) ts.push(((d.y > 0 ? r.bottom : r.top) - c.y) / d.y);
    const t = Math.min(...ts.filter((v) => v > 0)) + gap;
    return { x: c.x + d.x * t, y: c.y + d.y * t };
  };
  const unit = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; return { x: dx / l, y: dy / l }; };
  // one arrow per direction used; a pair used both ways gets two lanes
  const arrows = {}, used = new Set();
  spec.beats.forEach((b) => b.flows.forEach((f) => used.add(f.from + '>' + f.to)));
  spec.beats.forEach((b, bi) => b.flows.forEach((f) => {
    const k = f.from + '>' + f.to;
    if (arrows[k]) { arrows[k].beats.add(bi); return; }
    const A = shape(f.from, f.fromSlot), B = shape(f.to, f.toSlot);
    let ca = centre(A.r), cb = centre(B.r);
    if (f.fromAt) ca = { x: ca.x + f.fromAt[0], y: ca.y + f.fromAt[1] };
    if (f.toAt) cb = { x: cb.x + f.toAt[0], y: cb.y + f.toAt[1] };
    const d = unit(ca, cb), nrm = { x: -d.y, y: d.x };
    const lane = used.has(f.to + '>' + f.from) ? 22 : 0;
    ca = { x: ca.x + nrm.x * lane, y: ca.y + nrm.y * lane }; cb = { x: cb.x + nrm.x * lane, y: cb.y + nrm.y * lane };
    const bend = f.bend || 0;
    const ctl = { x: (ca.x + cb.x) / 2 + nrm.x * bend, y: (ca.y + cb.y) / 2 + nrm.y * bend };
    const p0 = exit(A, ca, unit(ca, bend ? ctl : cb), 12), p1 = exit(B, cb, unit(cb, bend ? ctl : ca), 22);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', bend ? `M${p0.x} ${p0.y} Q${ctl.x} ${ctl.y} ${p1.x} ${p1.y}` : `M${p0.x} ${p0.y} L${p1.x} ${p1.y}`);
    const dark = [f.from, f.to].some((e) => nodes[e]?.a.dark) || (f.dark ?? false);
    path.setAttribute('class', 'arrow' + (dark ? ' dark' : ''));
    svg.append(path);
    arrows[k] = { path, len: path.getTotalLength(), first: f.t0, beats: new Set([bi]), dark, mid: { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 } };
  }));
  // the key a hosted app calls Membase with, over the arrow between them
  let key = null;
  if (mb.key) {
    const app = spec.actors.find((a) => a.kind === 'app');
    const ks = Object.keys(arrows).filter((k) => app && (k.startsWith(app.id + '>') && k.split('>')[1].split('.')[0] === mb.id));
    if (ks.length) {
      const ar = arrows[ks[0]];
      key = { el: el('div', 'xkey', `<span class="chip">${ui['key-round']}<span>${mb.key}</span></span>`), first: ar.first };
      key.el.style.left = ar.mid.x + 'px'; key.el.style.top = ar.mid.y + 72 + 'px';  // under the call it rides on
      toks.append(key.el);
    }
  }
  // the tokens and results
  const flows = [];
  spec.beats.forEach((b, bi) => b.flows.forEach((f) => {
    const tk = el('div', 'xtok');
    // what recall hands out: a lit passage, or nothing from a memory never written to
    const preset = mb.slots.find((s) => s.id === f.fromSlot)?.facts?.length > 0;
    const learned = preset || spec.beats.some((x) => x.inside && ['learn', 'forget'].includes(x.inside.kind) && x.inside.facts.length && x.inside.slots.includes(f.fromSlot) && x.inside.t0 < f.t0);
    const cls = f.token.style || (b.membase === 'recall' && f.fromSlot != null ? (learned ? 'hit' : 'none') : '');
    const glyph = f.token.svg || { hit: ui.sparkles, none: ui.x }[cls] || '';
    const chip = el('span', 'chip ' + cls, glyph + `<span>${f.token.label}</span>`);
    tk.append(chip); toks.append(tk);
    let res = null;
    if (f.result && nodes[f.to].res) {
      res = el('span', 'chip ' + (f.ok === false ? 'no' : 'ok'), (f.ok === false ? ui.x : ui.check) + `<span>${f.result}</span>`);
      nodes[f.to].res.append(res);
    }
    flows.push({ f, b, bi, tk, chip, res, ar: arrows[f.from + '>' + f.to] });
  }));
  XS = { spec, nodes, slots, arrows, flows, cap, key, mb };
}

function renderExplain(spec, t, fade) {
  const keyOf = JSON.stringify([spec.title, spec.length, spec.beats.map((b) => b.say)]);
  if (!XS || XS.keyOf !== keyOf) { buildExplain(spec); XS.keyOf = keyOf; }
  const { nodes, slots, arrows, flows, cap, key, mb } = XS, ui = spec.ui;
  const root = $('explain');
  root.style.opacity = fade;
  const beats = spec.beats;
  let bi = -1;
  beats.forEach((b, i) => { if (t >= b.t0) bi = i; });
  const beat = beats[bi], live = beat && t < beat.t1 ? beat : null;
  // actors pop in one after another, then the ones in the current beat light up
  const ids = new Set();
  if (live) live.flows.forEach((f) => { ids.add(f.from.split('.')[0]); ids.add(f.to.split('.')[0]); });
  spec.actors.forEach((a, i) => {
    const nd = nodes[a.id], k = sm((t - 0.1 - i * 0.09) / 0.4);
    const dim = live && !ids.has(a.id) && !nd.frame ? (a.kind === 'membase' ? 0.75 : 0.42) : 1;
    nd.el.style.opacity = k * dim;
    if (!nd.frame) nd.el.style.transform = (a.kind === 'membase' ? '' : '') + `translateY(${(1 - k) * 24}px)`;
    nd.el.classList.toggle('on', !!live && ids.has(a.id) && !nd.frame);
  });
  // arrows: appear on first use, light up in the beats that use them
  for (const ar of Object.values(arrows)) {
    const on = !!live && ar.beats.has(bi);
    ar.path.style.opacity = sm((t - ar.first + 0.25) / 0.3);
    ar.path.classList.toggle('on', on);
    ar.path.setAttribute('marker-end', `url(#ah${on ? 'on' : ''}${ar.dark ? 'd' : ''})`);
  }
  if (key) key.el.style.opacity = sm((t - key.first + 0.25) / 0.3);
  // tokens travel; results land
  for (const fl of flows) {
    const { f } = fl, k = (t - f.t0) / (f.t1 - f.t0);
    const vis = k >= -0.02 && k <= 1.06;
    fl.tk.hidden = !vis;
    if (vis) {
      const q = sm(k), p = fl.ar.path.getPointAtLength(fl.ar.len * q);
      fl.tk.style.transform = `translate(${p.x}px, ${p.y}px) scale(${0.85 + 0.15 * sm(k / 0.15)})`;
      fl.tk.style.opacity = Math.min(sm((k + 0.02) / 0.12), sm((1.06 - k) / 0.12));
    }
    if (fl.res) {
      const on = t >= f.t1 && t < fl.b.t1 + (fl.bi === beats.length - 1 ? 99 : 0);
      fl.res.style.opacity = on ? sm((t - f.t1) / 0.25) : 0;
      fl.res.style.display = on ? '' : 'none';
    }
  }
  // Membase, inside: what each slot holds now, and the learn or recall step playing
  const held = {};
  const mbIn = sm((t - 0.1 - spec.actors.indexOf(mb) * 0.09) / 0.4);  // what it holds from the start comes in with it
  for (const s of mb.slots) held[s.id] = (s.facts || []).map((label) => ({ label, k: mbIn }));
  const insideNow = live && live.inside && t >= live.inside.t0 - 0.05 ? live.inside : null;
  for (const b of beats) {
    const ins = b.inside;
    if (!ins || ins.kind === 'recall' || t < ins.t0) continue;
    const k = (t - ins.t0) / (ins.t1 - ins.t0);
    for (const s of ins.slots) {
      if (ins.kind === 'forget') {
        // struck out during the beat, gone after it
        held[s] = held[s].filter((x) => !(ins.forget.includes(x.label) && t >= b.t1));
        held[s].forEach((x) => { if (ins.forget.includes(x.label)) x.gone = sm((k - 0.3) / 0.3); });
      }
      ins.facts.forEach((label, j) => held[s].push({ label, k: sm((k - 0.52 - j * 0.1) / 0.3) }));
    }
  }
  const pills = nodes[mb.id].pills;
  for (const kind of ['learn', 'recall', 'forget']) {
    if (pills[kind]) pills[kind].classList.toggle('on', !!insideNow && insideNow.kind === kind && t < insideNow.t1 + 0.4);
  }
  const bars = [78, 60, 70, 52, 66];
  for (const s of mb.slots) {
    const sl = slots[s.id], facts = held[s.id].filter((x) => x.k > 0);
    const mine = insideNow && insideNow.slots.includes(s.id) ? insideNow : null;
    const k = mine ? (t - mine.t0) / (mine.t1 - mine.t0) : 0;
    sl.el.classList.toggle('on', !!mine);
    const hitIdx = mine && mine.kind === 'recall' && facts.length ? (mine.hit ?? facts.length - 1) : -1;
    const lit = hitIdx >= 0 && k > 0.72;
    sl.rows.innerHTML = '';
    if (!facts.length && !(mine && mine.kind !== 'recall')) sl.rows.append(el('div', 'empty', s.empty || 'empty'));
    facts.forEach((x, j) => {
      const gone = x.gone > 0.5;
      const r = el('div', 'row' + (lit && j === hitIdx ? ' hit' : '') + (gone ? ' gone' : ''), (gone ? ui.eraser : ui.sparkles) + (x.label ? `<span>${x.label}</span>` : `<i style="width:${bars[j % bars.length]}%"></i>`));
      r.style.opacity = x.k; r.style.transform = `scaleX(${0.4 + 0.6 * x.k})`;
      sl.rows.append(r);
    });
    sl.fx.innerHTML = '';
    if (!mine) continue;
    // where the facts are, in the slot's own coordinates
    const R = { x: sl.rows.offsetLeft, y: sl.rows.offsetTop, w: sl.rows.offsetWidth, h: Math.max(50, sl.rows.offsetHeight) };
    if (mine.kind !== 'recall') {
      if (k > 1) continue;
      // the file drops in, then gives way to facts
      const inbound = live.flows.find((f) => f.toSlot === s.id);
      const c = el('span', 'chip', ui['file-text'] + `<span>${inbound ? inbound.token.label : ''}</span>`);
      // it lands where the new facts will be: after what the slot already holds
      const n = sl.rows.children.length;
      c.style.left = (sl.across ? R.x + (n ? sl.rows.offsetWidth + 12 : 0) : R.x + R.w / 2) + 'px';
      c.style.top = R.y + (n && !sl.across ? sl.rows.offsetHeight + 10 : 0) + 25 - 40 * (1 - sm(k / 0.3)) + 'px';
      c.style.transform = `translate(${sl.across ? 0 : -50}%, -50%) scale(${1 - 0.3 * sm((k - 0.36) / 0.2)})`;
      c.style.transformOrigin = sl.across ? '0 50%' : '50% 50%';
      c.style.opacity = Math.min(sm(k / 0.12), 1 - sm((k - 0.36) / 0.18));
      sl.fx.append(c);
      continue;
    }
    // recall: a lens comes in and runs over the facts; the one that answers lights up
    const hitRow = hitIdx >= 0 ? sl.rows.children[hitIdx] : null;
    const to = hitRow ? { x: hitRow.offsetLeft + (sl.across ? -34 : 30), y: hitRow.offsetTop + 25 } : { x: R.x + (sl.across ? 60 : R.w / 2), y: R.y + 25 };
    const from = sl.across ? { x: R.x - 40, y: to.y } : { x: to.x, y: R.y + 25 };
    if (k <= 1.05) {
      const lens = el('div', 'lens', ui.search), q = sm((k - 0.1) / 0.55);
      lens.style.left = from.x + (to.x - from.x) * q + 'px';
      lens.style.top = from.y + (to.y - from.y) * q - 38 + 'px';
      lens.style.opacity = Math.min(sm(k / 0.12), 1 - sm((k - 0.85) / 0.15));
      sl.fx.append(lens);
    }
    if (!hitRow && k > 0.7) {
      sl.rows.innerHTML = '';
      const c = el('span', 'chip no', ui.x + '<span>nothing</span>');
      c.style.left = (sl.across ? R.x + 90 : R.x + R.w / 2) + 'px'; c.style.top = R.y + 25 + 'px';
      c.style.transform = 'translate(-50%, -50%)'; c.style.opacity = sm((k - 0.7) / 0.2);
      sl.fx.append(c);
    }
  }
  // the caption: what this beat shows
  cap.hidden = !beat;
  if (beat) {
    cap.querySelector('.n').textContent = bi + 1;
    cap.querySelector('.t').textContent = beat.say;
    const a = sm((t - beat.t0) / 0.3);
    cap.style.opacity = a;
    cap.style.transform = `translateX(-50%) translateY(${(1 - a) * 14}px)`;
  }
}

window.render = async (st) => {
  if (st.view) VIEW = st.view;
  document.documentElement.style.setProperty('--panel', st.panel || '#3e61ff');
  const mode = st.mode;
  $('banner').hidden = mode !== 'banner';
  $('stage').hidden = mode === 'banner';
  const tasks = [];
  if (mode === 'banner') {
    $('bTag').textContent = st.tag; $('bTitle').innerHTML = st.title; $('bPitch').textContent = st.pitch;
    $('bUrl').innerHTML = st.url;
    tasks.push(load($('bShot'), st.shot));
    await Promise.all(tasks);
    return;
  }
  const r = rest();
  const win = $('win');
  win.style.left = r.x + 'px'; win.style.top = r.y + 'px'; win.style.width = r.w + 'px';
  $('url').innerHTML = st.url;
  $('cornerText').textContent = st.corner || '';
  tasks.push(load($('shot'), st.frame));
  // ease from the previous framing to this one (k: 0 -> 1)
  const a = camera(st.prev ?? null), b = camera(st.box ?? null), k = st.k ?? 1;
  const c = { s: a.s + (b.s - a.s) * k, tx: a.tx + (b.tx - a.tx) * k, ty: a.ty + (b.ty - a.ty) * k };
  $('cam').style.transform = `translate(${c.tx}px, ${c.ty}px) scale(${c.s})`;

  // spotlight: slides from the previous box to this one, fades in from none and out to none
  const spot = $('spot'), sc = r.w / VIEW.w;
  let sb = null, alpha = 1;
  // between two boxes: fade out where it was, fade in where it goes (a sliding hole reads as a blank card)
  if (st.box && st.prev && st.slide) sb = st.prev.map((v, i) => v + (st.box[i] - v) * k);  // same element, moved
  else if (st.box && st.prev) { sb = k < 0.5 ? st.prev : st.box; alpha = Math.abs(1 - 2 * k); }
  else if (st.box) { sb = st.box; alpha = k; }
  else if (st.prev) { sb = st.prev; alpha = 1 - k; }
  spot.hidden = !sb || alpha <= 0.01;
  if (sb) {
    Object.assign(spot.style, { left: sb[0] * sc + 'px', top: CHROME + sb[1] * sc + 'px',
      width: sb[2] * sc + 'px', height: sb[3] * sc + 'px', opacity: alpha });
  }

  // step label
  const step = $('step');
  step.hidden = !st.step;
  if (st.step) {
    $('stepN').textContent = st.step.n; $('stepT').textContent = st.step.title; $('stepD').textContent = st.step.detail || '';
    step.style.opacity = st.step.alpha ?? 1;
    step.style.transform = `translateX(-50%) translateY(${(1 - (st.step.alpha ?? 1)) * 18}px)`;
  }
  // wait badge
  $('wait').hidden = !st.wait;
  if (st.wait) { $('waitText').textContent = st.wait.text; $('waitX').textContent = st.wait.x; }

  // intro: the banner at full frame, sliding away to the left at the end
  const intro = $('intro');
  intro.hidden = st.intro == null;
  if (st.intro != null) {
    intro.classList.toggle('short', !!st.line);
    // a long title steps down until it takes at most three lines
    const h1 = $('iTitle');
    if (h1.dataset.fit !== st.title + !!st.line) {
      h1.dataset.fit = st.title + !!st.line;
      h1.innerHTML = st.line ? st.title.replace(/<br\s*\/?>/g, ' ') : st.title;  // short form: wrap freely
      h1.style.fontSize = '';
      await document.fonts.load("700 100px 'Bricolage Grotesque'", st.title);  // measure in the real face
      if (st.line) for (let fs = 100; fs > 60 && h1.offsetHeight > fs * 3.1; fs -= 4) h1.style.fontSize = fs - 4 + 'px';
    }
    $('iKick').textContent = st.kick; $('iPitch').textContent = st.line || st.pitch;
    $('iBase').textContent = st.base; $('iUrl').innerHTML = st.url;
    tasks.push(load($('iShot'), st.introShot || st.frame));
    const q = st.intro;             // 0 = fully shown, 1 = gone
    const ease = q * q * (3 - 2 * q);
    intro.style.transform = `translateX(${-ease * 100}%)`;
    const enter = st.enter ?? 1;    // the window drifts in during the first second
    const e2 = 1 - Math.pow(1 - enter, 3);
    $('iWin').style.transform = `translate(${(1 - e2) * 160}px, ${(1 - e2) * 30}px)`;
    $('iWin').style.opacity = 0.3 + 0.7 * e2;
  }
  // architecture card: fades in and out; nodes appear one after another
  const arch = $('arch');
  arch.hidden = st.arch == null;
  if (st.arch != null) {
    arch.style.opacity = st.arch;
    $('archKick').textContent = st.archKick || 'How it works'; $('archTitle').textContent = st.archTitle || '';
    $('archFoot').textContent = st.archFoot || '';
    const chain = $('archChain');
    if (chain.dataset.key !== JSON.stringify(st.archNodes)) {
      chain.dataset.key = JSON.stringify(st.archNodes);
      chain.replaceChildren();
      st.archNodes.forEach((n, i) => {
        if (i) { const a = document.createElement('div'); a.className = 'arrow'; a.textContent = '→'; chain.append(a); }
        const d = document.createElement('div'); d.className = 'node' + (n.mb ? ' mb' : '');
        d.innerHTML = `<b>${n.t}</b><span>${n.d}</span>`; chain.append(d);
      });
    }
    [...chain.children].forEach((c, i) => {
      const k = Math.max(0, Math.min(1, (st.archT - 0.35 * Math.floor(i / 2 + 0.5)) / 0.4));
      c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 16}px)`;
    });
  }
  // the explainer
  $('explain').hidden = st.explain == null;
  if (st.explain != null) renderExplain(st.explain, st.explainT, st.explainFade);
  // outro
  const outro = $('outro');
  outro.hidden = st.outro == null;
  if (st.outro != null) {
    outro.style.opacity = st.outro;
    $('oTitle').innerHTML = st.title; $('oPitch').textContent = st.pitch; $('oBase').textContent = st.base;
  }
  await Promise.all(tasks);
};
</script>
</body>
</html>
