<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Dark Lamp at Saltmarsh</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
    :root {
      --night: #10171d; --ink: #2a2018; --pen: #22364a; --pencil: #8a8274;
      --paper: #f3ead5; --paper-2: #e9dcbf; --rule: #b8c7d3; --margin: #c7685a;
      --gold: #e2b25c; --cream: #f3e8cf; --leather: #3b281d; --seal: #9b2c22;
      --fell: "IM Fell English", Georgia, serif; --fell-sc: "IM Fell English SC", Georgia, serif;
      --body: "Spectral", Georgia, serif; --hand: "Caveat", "Segoe Print", cursive; --type: "Special Elite", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream); font-family: var(--body); overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: progress; opacity: .6; }
    [hidden] { display: none !important; }
    .game { position: fixed; inset: 0; min-width: 1100px; }

    /* ---- the world behind everything ---- */
    .world { position: absolute; inset: 0; overflow: hidden; }
    .world > div { position: absolute; inset: 0; transition: opacity .9s ease; }
    .world svg { width: 100%; height: 100%; display: block; }
    #cam { transition: transform 1.6s cubic-bezier(.45,.05,.2,1); }
    .beam { animation: beam 7s ease-in-out infinite; }
    @keyframes beam { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
    .flicker { animation: flicker 1.8s ease-in-out infinite alternate; }
    @keyframes flicker { from { opacity: .82; } to { opacity: 1; } }
    #room { opacity: 0; }
    .game.evening #room { opacity: 1; } .game.evening #harbour { opacity: 0; }
    .shade { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(8,11,14,.86) 0, rgba(8,11,14,.35) 92px, transparent 150px),
                  linear-gradient(0deg, rgba(8,11,14,.55) 0, transparent 260px); }

    /* ---- the top bar: title, the three people you can visit, and what you can do ---- */
    .bar { position: absolute; left: 0; right: 0; top: 0; height: 76px; display: flex; align-items: center; gap: 22px; padding: 0 30px 0 36px; z-index: 5; }
    .bar h1 { margin: 0; font: 400 27px/1 var(--fell); color: var(--cream); white-space: nowrap; }
    .bar h1 i { display: block; font: italic 400 14px/1.4 var(--body); color: #b9ad94; margin-top: 3px; }
    .cast { display: flex; gap: 4px; margin-left: 8px; }
    .who-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 14px 6px 6px; border-radius: 40px; text-align: left; transition: background .2s; }
    .who-btn:hover { background: rgba(243,232,207,.08); }
    .who-btn .medal { width: 44px; height: 44px; }
    .who-btn b { display: block; font: 400 18px/1.1 var(--fell); color: var(--cream); white-space: nowrap; }
    .who-btn small { display: block; font: italic 13px/1.3 var(--body); color: #a99e86; white-space: nowrap; }
    .who-btn.on { background: rgba(226,178,92,.16); }
    .who-btn.on .medal { box-shadow: 0 0 0 2.5px var(--gold); }
    .acts { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .act { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 9px 13px; border-radius: 4px; border: 1px solid rgba(243,232,207,.35);
      background: rgba(16,20,24,.55); font: 400 17px/1 var(--fell); color: var(--cream); white-space: nowrap; }
    .act:hover { border-color: var(--gold); color: #fff; }
    .act svg { width: 19px; height: 19px; color: var(--gold); }
    .act.accuse svg { color: #e58b74; }
    .act.ghost { border-color: transparent; background: none; color: #a99e86; font-size: 15px; padding: 9px 4px; }
    .medal { flex: none; display: block; border-radius: 50%; overflow: hidden; background: #e7d9bb; box-shadow: 0 0 0 1.5px rgba(42,32,24,.6); }
    .medal svg { width: 100%; height: 100%; display: block; }

    /* ---- the person you are talking to ---- */
    .actor { position: absolute; left: 60px; bottom: 245px; width: 400px; height: 525px; z-index: 2; transition: opacity .5s, transform .5s; }
    .actor svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); transform-origin: 50% 100%; }
    .actor.enter { opacity: 0; transform: translateX(-18px); }
    .actor.speaking svg { animation: speak .9s ease-in-out infinite; }
    @keyframes speak { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px) rotate(-.3deg); } }
    .place { position: absolute; left: 0; width: 960px; top: 112px; text-align: center; font: italic 400 36px/1 var(--fell); color: var(--cream);
      text-shadow: 0 2px 12px rgba(0,0,0,.7); opacity: 0; transition: opacity .7s; pointer-events: none; z-index: 3; }
    .place.show { opacity: 1; }
    .place::before, .place::after { content: "~"; color: var(--gold); margin: 0 16px; font-style: normal; }

    /* ---- the dialogue box ---- */
    .box { position: absolute; left: 40px; width: 880px; bottom: 30px; min-height: 236px; z-index: 4; color: var(--ink);
      background: var(--paper); border-radius: 3px; padding: 32px 36px 18px; box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 0 0 1px #c9b893, inset 0 0 0 6px var(--paper), inset 0 0 0 7px #cdbd98;
      background-image: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.5), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(170,140,90,.18), transparent 55%); }
    .plate { position: absolute; left: 26px; top: -24px; display: flex; align-items: baseline; gap: 12px; padding: 9px 20px 8px; border-radius: 3px;
      background: var(--c, #6b4a35); color: #fbf3e2; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
    .plate b { font: 400 23px/1 var(--fell-sc); letter-spacing: .02em; }
    .plate small { font: italic 14px/1 var(--body); opacity: .85; }
    .you { font: italic 17px/1.45 var(--body); color: #6d604c; margin: 0 0 6px; }
    .you:empty { display: none; }
    .you::before { content: "You: "; font-style: normal; color: #9a8a6c; }
    .line { font: 400 24px/1.45 var(--body); margin: 0; min-height: 70px; color: var(--ink); }
    .line.stage { font-style: italic; color: #6d604c; font-size: 21px; }
    .dots span { animation: dot 1.2s infinite; opacity: .2; font-size: 30px; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 50% { opacity: 1; } }
    .say { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px dashed #c4b28c; }
    .say label { font: italic 16px var(--body); color: #8b7c62; white-space: nowrap; }
    .say input { flex: 1; min-width: 0; border: 0; background: transparent; font: italic 19px/1.4 var(--body); color: var(--pen); outline: none; padding: 4px 0; }
    .say input::placeholder { color: #a8997c; }
    .say button { border: 0; background: var(--ink); color: var(--paper); font: 400 17px/1 var(--fell); padding: 9px 20px; border-radius: 3px; }
    .say button:hover { background: #4a3626; }
    .err { color: var(--seal); font: italic 18px var(--body); }

    /* ---- what the game tells you a character will remember ---- */
    .notes { position: absolute; right: 520px; top: 96px; z-index: 6; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
    .note { display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 3px; background: rgba(14,16,18,.86);
      border-left: 3px solid var(--gold); font: italic 18px/1.3 var(--body); color: var(--cream); box-shadow: 0 6px 18px rgba(0,0,0,.35); animation: note-in .5s ease-out; }
    .note svg { width: 20px; height: 20px; color: var(--gold); flex: none; }
    .note b { font-style: normal; font-weight: 500; }
    .note.wait { border-left-color: #8d8473; color: #d6cbb3; }
    .note.wait svg { color: #b3a98f; }
    @keyframes note-in { from { opacity: 0; transform: translateY(-6px); } }

    /* ---- the notebook ---- */
    .book { position: absolute; right: 30px; top: 88px; bottom: 30px; width: 456px; z-index: 4; background: var(--leather); border-radius: 6px 10px 10px 6px;
      padding: 10px 12px 10px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px #5a3f2e; transform: rotate(.4deg); }
    .book::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(226,178,92,.35); border-radius: 5px 8px 8px 5px; pointer-events: none; }
    .page { position: relative; height: 100%; background: var(--paper); border-radius: 2px 4px 4px 2px; color: var(--ink); overflow: hidden;
      background-image: linear-gradient(90deg, transparent 52px, var(--margin) 52px, var(--margin) 53.5px, transparent 53.5px),
                        repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
      box-shadow: inset 8px 0 14px -8px rgba(60,40,20,.35); }
    .sheet { position: absolute; inset: 0; padding: 16px 22px 18px 66px; overflow: auto; scrollbar-width: none; }
    .sheet h2 { margin: 0 0 4px; font: 700 34px/1.1 var(--hand); color: var(--pen); }
    .sheet .rule { height: 2px; width: 180px; background: var(--pen); opacity: .5; border-radius: 2px; margin: 0 0 14px; transform: rotate(-.6deg); }
    .who { position: relative; margin: 0 0 10px; }
    .who .head { display: flex; align-items: center; gap: 10px; margin-left: -52px; }
    .who .medal { width: 42px; height: 42px; }
    .who .head b { font: 400 21px/1 var(--fell); }
    .entry { font: 500 21px/1.3 var(--hand); color: var(--pen); margin: 4px 0 0; }
    .entry .from { font-weight: 700; color: var(--src, var(--pen)); }
    .entry.fresh { animation: ink 1.6s ease-out both; }
    @keyframes ink { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .entry.none { color: var(--pencil); }
    .entry.more { color: var(--pencil); font-size: 18px; }
    .clip { position: relative; margin: 20px 4px 6px -34px; background: #fbf7ec; padding: 16px 18px 14px; transform: rotate(-.8deg);
      box-shadow: 0 3px 8px rgba(60,40,20,.25); border: 1px solid #e3d8bf; animation: note-in .6s ease-out; }
    .clip::before { content: ""; position: absolute; left: 50%; top: -11px; width: 92px; height: 22px; transform: translateX(-50%) rotate(2deg);
      background: rgba(226,214,170,.8); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .clip h3 { margin: 0 0 8px; font: 700 25px/1 var(--hand); color: var(--pen); }
    .clip .mem { font: 400 15px/1.5 var(--type); color: #3b3026; margin: 0; }
    .clip .mem + .mem { margin-top: 10px; padding-top: 10px; border-top: 1px dotted #cbbd9c; }
    .clip .when { display: inline-block; font: 400 12.5px/1 var(--type); color: #fbf7ec; background: #7d6c55; padding: 3px 6px; border-radius: 2px; margin-right: 6px; transform: translateY(-1px); }
    .clip .nothing { font: 500 22px/1.3 var(--hand); color: var(--pencil); margin: 0; }

    /* ---- later that evening ---- */
    .evening-card { position: absolute; left: 0; top: 0; bottom: 0; width: 960px; z-index: 3; }
    .evening-card .title { position: absolute; left: 0; right: 0; top: 100px; text-align: center; animation: note-in .7s ease-out; }
    .evening-card .title b { display: block; font: italic 400 40px/1.1 var(--fell); color: var(--cream); text-shadow: 0 2px 14px rgba(0,0,0,.6); }
    .evening-card .title span { display: block; margin-top: 8px; font: italic 18px/1.4 var(--body); color: #e0d0ac; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
    .orn { display: block; width: 220px; height: 14px; margin: 10px auto 0; color: var(--gold); }
    .pair { position: absolute; left: 40px; right: 40px; bottom: 196px; height: 433px; }
    .pair .p { position: absolute; bottom: 0; width: 330px; height: 433px; animation: note-in .8s ease-out both; }
    .pair .p svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }
    .pair .p.left { left: 50px; }
    .pair .p.right { right: 50px; animation-delay: .25s; }
    .pair .p.right svg { transform: scaleX(-1); filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)) brightness(.88); }
    .heard { display: flex; align-items: center; gap: 9px; margin-top: 12px; font: italic 18px/1.3 var(--body); color: #6d5a3b; }
    .heard svg { width: 20px; height: 20px; color: #9a7a3a; }
    .heard b { font-style: normal; font-weight: 600; color: var(--ink); }
    .go { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed #c4b28c; }
    .go button { border: 1px solid #b9a782; background: transparent; color: var(--ink); font: 400 17px/1 var(--fell); padding: 9px 16px; border-radius: 3px; }
    .go button.main { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* ---- the accusation ---- */
    .verdict { position: absolute; inset: 0; z-index: 8; background: radial-gradient(ellipse at 50% 40%, #22190f, #080605); display: grid; place-items: center; animation: fade .5s; }
    @keyframes fade { from { opacity: 0; } }
    .verdict h2 { margin: 0; text-align: center; font: italic 400 44px/1.1 var(--fell); color: var(--cream); }
    .verdict .sub { text-align: center; font: italic 18px var(--body); color: #b9ad94; margin: 10px 0 40px; }
    .lineup { display: flex; gap: 48px; justify-content: center; }
    .suspect { width: 250px; border: 0; background: none; padding: 0; text-align: center; color: var(--cream); }
    .frame { width: 250px; height: 300px; border-radius: 125px 125px 8px 8px; overflow: hidden; background: linear-gradient(#58686a, #3c4a4d); box-shadow: 0 0 0 6px #6b4a2e, 0 0 0 9px #2a1c12, 0 18px 30px rgba(0,0,0,.6); transition: box-shadow .2s, transform .2s; }
    .frame svg { width: 100%; height: 112%; display: block; margin-top: 10px; }
    .suspect:hover .frame { box-shadow: 0 0 0 6px var(--seal), 0 0 0 9px #2a1c12, 0 18px 30px rgba(0,0,0,.6); transform: translateY(-4px); }
    .suspect b { display: block; margin-top: 24px; font: 400 24px/1 var(--fell); }
    .suspect small { display: block; margin-top: 6px; font: italic 15px var(--body); color: #b9ad94; }
    .back { display: block; margin: 36px auto 0; border: 0; background: none; color: #b9ad94; font: italic 17px var(--body); text-decoration: underline; text-underline-offset: 4px; }
    .reveal { display: grid; grid-template-columns: 330px 600px; gap: 64px; align-items: center; }
    .reveal .frame { width: 330px; height: 410px; border-radius: 165px 165px 8px 8px; }
    .reveal .portrait { position: relative; }
    .stamp { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%) rotate(-11deg); padding: 10px 22px 8px; border: 4px solid #d2402f; border-radius: 6px;
      color: #e04a37; font: 400 36px/1 var(--fell-sc); letter-spacing: .06em; white-space: nowrap; background: rgba(20,10,8,.35); animation: stamp .45s cubic-bezier(.2,1.6,.4,1) .3s both; }
    @keyframes stamp { from { opacity: 0; transform: translateX(-50%) rotate(-11deg) scale(2.2); } }
    .reveal h2 { text-align: left; font-size: 50px; }
    .reveal .truth { font: 400 18px/1.6 var(--body); color: #e2d6bb; margin: 26px 0 0; }
    .scrap { position: relative; margin: 24px 0 0 4px; width: 460px; padding: 24px 30px 22px 36px; background-color: #eadbb8; color: var(--ink); transform: rotate(-1.6deg);
      clip-path: polygon(0 6%, 7% 0, 22% 4%, 40% 0, 58% 5%, 77% 1%, 92% 6%, 100% 2%, 98% 40%, 100% 72%, 96% 100%, 78% 95%, 60% 100%, 38% 94%, 18% 100%, 4% 95%, 2% 60%);
      box-shadow: inset 0 0 34px rgba(90,45,10,.6); background-image: repeating-linear-gradient(180deg, transparent 0 27px, rgba(80,110,140,.35) 27px 28px); }
    .scrap i { display: block; font: italic 14px var(--body); color: #6d5a3b; margin-bottom: 4px; }
    .scrap b { font: 700 31px/1.15 var(--hand); color: #20324a; }
    .reveal .again { margin-top: 26px; border: 1px solid rgba(243,232,207,.4); background: none; color: var(--cream); font: 400 18px var(--fell); padding: 10px 20px; border-radius: 3px; }

    /* ---- the opening card ---- */
    .opening { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, rgba(16,22,28,.78), rgba(8,10,12,.95)); }
    .opening .inner { width: 720px; text-align: center; }
    .opening h2 { margin: 0; font: 400 64px/1.05 var(--fell); color: var(--cream); }
    .opening .orn { width: 260px; height: 16px; margin: 18px auto; }
    .opening p { font: italic 20px/1.6 var(--body); color: #d9cdb2; margin: 0 0 30px; }
    .opening .opt { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 34px; font: italic 15px/1.4 var(--body); color: #9d927b; }
    .opening #begin { border: 1px solid var(--gold); background: rgba(226,178,92,.12); color: var(--cream); font: 400 22px var(--fell); padding: 12px 34px; border-radius: 3px; }
  </style>
</head>
<body>
<div class="game" id="game">
  <div class="world"><div id="harbour"></div><div id="room"></div></div>
  <div class="shade"></div>

  <header class="bar">
    <h1>The Dark Lamp at Saltmarsh<i>A harbour mystery in three conversations</i></h1>
    <nav class="cast" id="cast" aria-label="Who to visit"></nav>
    <div class="acts">
      <button class="act" id="pass" type="button" title="Whoever has heard something from you meets the person they tell everything"><span id="i-moon"></span>Let the evening pass</button>
      <button class="act accuse" id="accuse-open" type="button"><span id="i-seal"></span>Accuse</button>
      <button class="act ghost" id="case-open" type="button">The case</button>
      <button class="act ghost" id="newgame" type="button">New case</button>
    </div>
  </header>

  <div class="place" id="place"></div>
  <div class="notes" id="status" aria-live="polite"></div>

  <div class="actor" id="actor"></div>
  <section class="box" id="talk">
    <div class="plate" id="speaker"><b></b><small></small></div>
    <p class="you" id="you"></p>
    <p class="line" id="line"></p>
    <form class="say" id="say" autocomplete="off">
      <label for="msg">You say</label>
      <input id="msg" placeholder="Say something">
      <button id="send">Say</button>
    </form>
  </section>

  <section class="evening-card" id="evening" hidden></section>

  <aside class="book" id="notebook">
    <div class="page">
      <div class="sheet" id="heard">
        <h2>Who's heard what</h2><div class="rule"></div>
        <div id="knows"></div>
        <div id="recalled"></div>
      </div>
    </div>
  </aside>

  <div class="verdict" id="accuse" hidden></div>

  <div class="opening" id="opening" hidden>
    <div class="inner">
      <h2>The Dark Lamp at Saltmarsh</h2>
      <svg class="orn" viewBox="0 0 260 16"><path d="M0 8 H112 M148 8 H260 M130 2 l6 6 -6 6 -6 -6 Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <p id="opening-text"></p>
      <button id="begin" type="button">Take the case</button>
      <label class="opt"><input type="checkbox" id="auto"> People may also pass things on straight after you speak to them, not only when the evening passes</label>
    </div>
  </div>
</div>

<script type="module">
  import { harbour, innRoom, portrait, icons } from "/static/art.js";
  import { el, api, stream } from "/kit/kit.js";

  const $ = (s) => document.querySelector(s);
  const KEY = "npc-mystery-player";
  const PRONOUN = { mara: "her", elsie: "her", tobias: "him" };
  // where the camera looks for each person: a point in the harbour drawing and a zoom
  const CAMERA = { mara: [430, 540, 1.25], elsie: [1080, 650, 1.4], tobias: [1280, 262, 1.35] };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const ORN = `<svg class="orn" viewBox="0 0 220 14"><path d="M0 7 H96 M124 7 H220 M110 1 l6 6 -6 6 -6 -6 Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;

  let story = null, game = null, player = null, current = "mara", busy = false;
  const recalled = {};      // npc -> the hits it recalled for its last reply
  const fresh = new Set();  // notebook entries to ink in on the next render

  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch { /* the game still works this session */ } },
  };
  const npc = (id) => story.npcs.find((n) => n.id === id);
  const first = (id) => npc(id).name.split(" ")[0];
  const svgOf = (markup) => { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; };
  const box = (cls, markup) => { const d = el("div", { class: cls }); d.innerHTML = markup; return d; };
  const medal = (id) => box("medal", portrait(id, { face: true }));
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1).replace(/[\s,;:]+\S*$/, "") + "…" : s);

  $("#harbour").innerHTML = harbour();
  $("#room").innerHTML = innRoom();
  $("#i-moon").replaceWith(svgOf(icons.moon));
  $("#i-seal").replaceWith(svgOf(icons.seal));
  boot().catch((e) => fail(e));

  async function boot() {
    story = await api("/api/story");
    $("#opening-text").textContent = story.intro;
    player = store.get();
    game = player ? await api(`/api/game?player=${encodeURIComponent(player)}`).catch(() => null) : null;
    if (!game) { await newGame(); $("#opening").hidden = false; }
    $("#auto").checked = game.auto_gossip;
    visit(current, { arrive: true });
    if (game.accused) showAccuse();
  }

  async function newGame() {
    game = await api("/api/new", {});
    player = game.player;
    store.set(player);
    for (const k of Object.keys(recalled)) delete recalled[k];
    current = "mara";
  }

  function fail(e, where = $("#line")) {
    where.replaceChildren(el("span", { class: "err" }, String(e.message || e)));
  }

  // ---- the camera and the cast ---------------------------------------------------------
  function camera(id) {
    const [x, y, k] = CAMERA[id];
    $("#cam").style.transform = `translate(${780 - k * x}px, ${330 - k * y}px) scale(${k})`;
  }

  function renderCast() {
    const evening = $("#game").classList.contains("evening");
    $("#cast").replaceChildren(...story.npcs.map((n) => el("button", {
      class: "who-btn" + (n.id === current && !evening ? " on" : ""), id: `npc-${n.id}`, type: "button",
      onclick: () => visit(n.id),
    }, medal(n.id), el("span", {}, el("b", {}, n.name), el("small", {}, n.place)))));
  }

  function visit(id, { arrive = false } = {}) {
    if (busy) return;
    const moved = arrive || id !== current || $("#game").classList.contains("evening");
    current = id;
    $("#game").classList.remove("evening");
    $("#evening").hidden = true;
    $("#talk").hidden = false;
    $("#actor").hidden = false;
    camera(id);
    const n = npc(id);
    if (moved) {
      const actor = $("#actor");
      actor.classList.add("enter");
      actor.innerHTML = portrait(id);
      setTimeout(() => actor.classList.remove("enter"), 450);
      $("#place").textContent = n.place;
      $("#place").classList.add("show");
      clearTimeout(visit.t);
      visit.t = setTimeout(() => $("#place").classList.remove("show"), 2400);
      $("#status").replaceChildren();
    }
    $("#speaker").style.setProperty("--c", n.color);
    $("#speaker b").textContent = n.name;
    $("#speaker small").textContent = n.role;
    $("#msg").placeholder = `Say something to ${first(id)}`;
    const chat = game.chats[id];
    const lastYou = [...chat].reverse().find((m) => m.role === "user");
    const lastThem = [...chat].reverse().find((m) => m.role === "assistant");
    $("#you").textContent = lastYou ? `“${lastYou.content}”` : "";
    $("#line").className = "line" + (lastThem ? "" : " stage");
    $("#line").textContent = lastThem ? lastThem.content : n.idle;
    renderCast();
    renderBook();
  }

  // ---- the notebook ----------------------------------------------------------------------
  // What each person knows is what was written to their memory: what you said to them, and
  // what someone else passed on to them.
  function knowledge(id) {
    return [
      ...game.chats[id].filter((m) => m.role === "user").map((m) => ({ at: m.at || 0, from: "you", text: m.content })),
      ...game.gossip.filter((g) => g.to === id).map((g) => ({ at: g.at, from: g.from, text: g.what, gossip: true })),
    ].sort((a, b) => a.at - b.at);
  }

  function renderBook() {
    const latest = game.gossip[game.gossip.length - 1];
    $("#knows").replaceChildren(...story.npcs.map((n) => {
      const items = knowledge(n.id);
      const shown = items.slice(-3);
      const rows = shown.map((it) => el("p", {
        class: "entry" + (fresh.has(`${n.id}:${it.at}`) ? " fresh" : ""),
        ...(it.gossip && latest && it.at === latest.at ? { id: "gossip-written" } : {}),
      },
      el("span", { class: "from", style: it.from === "you" ? "" : `--src:${npc(it.from).color}` },
        it.from === "you" ? "you told " + PRONOUN[n.id] + ": " : `${first(it.from)} told ${PRONOUN[n.id]}: `),
      `“${clip(it.text, it.gossip ? 120 : 84)}”`));
      if (items.length > shown.length) rows.unshift(el("p", { class: "entry more" }, `…and ${items.length - shown.length} more before that`));
      if (!items.length) rows.push(el("p", { class: "entry none" }, "hasn't heard a thing"));
      return el("div", { class: "who", id: `knows-${n.id}` }, el("div", { class: "head" }, medal(n.id), el("b", {}, n.name)), ...rows);
    }));
    fresh.clear();
    renderRecalled();
  }

  // What the person you last spoke to recalled before answering: exactly the hits, unedited
  // apart from the date, which is shown as a stamp.
  function renderRecalled() {
    const hits = recalled[current];
    if (!hits || $("#game").classList.contains("evening")) return $("#recalled").replaceChildren();
    const body = hits.length
      ? hits.slice(0, 2).map((h) => {
        const m = h.content.match(/^On (\d{4})-(\d\d)-(\d\d),? (?:at )?(\d\d:\d\d)(?: UTC)?,\s*/);
        const text = m ? h.content.slice(m[0].length) : h.content;
        return el("p", { class: "mem" }, m ? el("span", { class: "when" }, `${+m[3]} ${MONTHS[+m[2] - 1]}, ${m[4]}`) : "",
          clip(text.charAt(0).toUpperCase() + text.slice(1), 210));
      })
      : [el("p", { class: "nothing" }, `Nothing. Nobody has told ${PRONOUN[current]} a thing about you.`)];
    $("#recalled").replaceChildren(el("div", { class: "clip", id: "memory-clip" }, el("h3", {}, `What ${first(current)} remembered`), ...body));
  }


  // ---- the notes the game shows: who will remember, who remembers -------------------------
  function note(id, icon, ...parts) {
    $("#status").querySelectorAll(".note.wait").forEach((w) => w.remove());
    const n = el("div", { class: "note" + (id ? "" : " wait"), ...(id ? { id } : {}) }, svgOf(icons[icon]), el("span", {}, ...parts));
    $("#status").append(n);
    return n;
  }

  function toldBy(id, hits) {
    // a recalled memory came from gossip when it names someone who passed something on to `id`
    const tellers = [...new Set(game.gossip.filter((g) => g.to === id).map((g) => g.from))];
    return tellers.filter((t) => hits.some((h) => h.content.includes(first(t))));
  }

  // ---- talking ---------------------------------------------------------------------------
  $("#say").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("#msg").value.trim();
    if (!message || busy || game.accused) return;
    const who = current;
    busy = true;
    $("#msg").value = "";
    $("#send").disabled = true;
    $("#status").replaceChildren();
    $("#you").textContent = `“${message}”`;
    $("#line").className = "line";
    $("#line").replaceChildren(el("span", { class: "dots" }, el("span", {}, "."), el("span", {}, "."), el("span", {}, ".")));
    note(null, "ear", `${first(who)} thinks back…`);
    let reply = "";
    try {
      await stream("/api/talk", { player, npc: who, message }, (ev) => {
        if (ev.type === "memories") {
          recalled[who] = ev.hits;
          const from = toldBy(who, ev.hits);
          if (from.length) note("remembers", "ear", `${first(who)} remembers what `, el("b", {}, from.map(first).join(" and ")), ` told ${PRONOUN[who]}.`);
          else if (ev.hits.length) note("remembers", "ear", `${first(who)} remembers talking with you.`);
          else note("remembers", "ear", `${first(who)} has heard nothing about you.`);
          renderRecalled();
          $("#actor").classList.add("speaking");
        } else if (ev.type === "delta") {
          if (!reply) $("#line").textContent = "";
          reply += ev.text;
          $("#line").textContent = reply;
        } else if (ev.type === "reply_done") {
          const at = Date.now() / 1000;
          game.chats[who].push({ role: "user", content: message, at }, { role: "assistant", content: reply.trim(), at });
          fresh.add(`${who}:${at}`);
          $("#actor").classList.remove("speaking");
          note(null, "quill", `${first(who)} is taking that in…`);
          renderBook();
        } else if (ev.type === "saved") {
          note("saved", "quill", el("b", {}, first(who)), " will remember that.");
        } else if (ev.type === "gossip") {
          game.gossip.push(ev);
          fresh.add(`${ev.to}:${ev.at}`);
          note("told", "ear", `${first(ev.from)} has already told ${first(ev.to)}.`);
          renderBook();
        }
      });
    } catch (err) {
      $("#status").replaceChildren();
      fail(err);
    } finally {
      busy = false;
      $("#send").disabled = false;
      $("#actor").classList.remove("speaking");
    }
  });

  // ---- the evening passes: someone tells the person they tell everything ---------------------
  $("#pass").addEventListener("click", async () => {
    if (busy || game.accused) return;
    busy = true;
    $("#pass").disabled = true;
    $("#status").replaceChildren();
    $("#game").classList.add("evening");
    $("#talk").hidden = true;
    $("#actor").hidden = true;
    renderCast();
    renderRecalled();
    const card = $("#evening");
    card.hidden = false;
    card.replaceChildren(box("title", `<b>The evening wears on…</b>${ORN}`));
    try {
      const out = await api("/api/gossip", { player });
      if (out.type === "gossip") {
        game.gossip.push(out);
        fresh.add(`${out.to}:${out.at}`);
        evening(out);
        renderBook();
      } else {
        quietEvening(out.reason || "Nobody passed anything on.");
      }
    } catch (e) {
      quietEvening(String(e.message || e));
    } finally {
      busy = false;
      $("#pass").disabled = false;
    }
  });

  function evening(g) {
    const from = npc(g.from), to = npc(g.to);
    const where = [g.from, g.to].includes("mara") ? "at the Gull & Lantern" : "on the quay";
    const others = story.npcs.filter((n) => n.id !== g.from);
    $("#evening").replaceChildren(
      box("title", `<b>Later that evening, ${where}</b><span>${from.name} tells ${to.name} what you said.</span>${ORN}`),
      el("div", { class: "pair" }, box("p left", portrait(g.from)), box("p right", portrait(g.to))),
      el("section", { class: "box", id: "gossip-card" },
        el("div", { class: "plate", style: `--c:${from.color}` }, el("b", {}, from.name), el("small", {}, `to ${to.name}`)),
        el("p", { class: "line", id: "gossip-said" }, g.what),
        el("div", { class: "heard" }, svgOf(icons.quill), el("span", {}, el("b", {}, first(g.to)), " will remember that. Nobody else heard it.")),
        el("div", { class: "go" }, ...others.map((n) => el("button", {
          class: n.id === g.to ? "main" : "", type: "button", id: `ask-${n.id}`, onclick: () => visit(n.id),
        }, n.id === g.to ? `Go and ask ${first(n.id)}` : `Ask ${first(n.id)}`)))));
  }

  function quietEvening(reason) {
    $("#evening").replaceChildren(
      box("title", `<b>A quiet evening</b>${ORN}`),
      el("section", { class: "box" }, el("p", { class: "line stage" }, reason),
        el("div", { class: "go" }, el("button", { class: "main", type: "button", onclick: () => visit(current) }, "Back"))));
  }

  // ---- the accusation ----------------------------------------------------------------------
  $("#accuse-open").addEventListener("click", () => { if (!busy) showAccuse(); });

  function showAccuse() {
    const pane = $("#accuse");
    pane.hidden = false;
    if (game.accused) return reveal({ correct: game.accused === game.culprit, suspect: game.accused, truth: game.truth });
    pane.replaceChildren(el("div", {},
      el("h2", {}, "Who tore the page from the logbook?"),
      el("p", { class: "sub" }, "Name them, and the case is closed."),
      el("div", { class: "lineup" }, ...story.npcs.map((n) => el("button", { class: "suspect", type: "button", id: `accuse-${n.id}`, onclick: () => accuse(n.id) },
        box("frame", portrait(n.id)), el("b", {}, n.name), el("small", {}, n.role)))),
      el("button", { class: "back", type: "button", onclick: () => { pane.hidden = true; } }, "Not yet. Keep asking around.")));
  }

  async function accuse(id) {
    try {
      const out = await api("/api/accuse", { player, suspect: id });
      game.accused = id; game.truth = out.truth; game.culprit = out.culprit;
      reveal(out);
    } catch (e) { fail(e, $("#accuse .sub")); }
  }

  function reveal(out) {
    const n = npc(out.suspect);
    $("#accuse").replaceChildren(el("div", { class: "reveal " + (out.correct ? "win" : "lose"), id: "reveal" },
      el("div", { class: "portrait" }, box("frame", portrait(out.suspect)), el("div", { class: "stamp" }, out.correct ? "Case closed" : "Wrong")),
      el("div", {},
        el("h2", {}, out.correct ? `It was ${n.name}.` : `Not ${n.name}.`),
        el("div", { class: "scrap" }, el("i", {}, "What the torn page said, in the deputy's hand"), el("b", {}, "Lamp dark 11:02 – 11:22. Keeper not at post.")),
        el("p", { class: "truth" }, out.truth),
        el("button", { class: "again", type: "button", onclick: () => $("#newgame").click() }, "Take a new case"))));
  }

  // ---- new case, options -------------------------------------------------------------------
  $("#begin").addEventListener("click", () => { $("#opening").hidden = true; });
  $("#case-open").addEventListener("click", () => { $("#begin").textContent = "Back to it"; $("#opening").hidden = false; });
  $("#newgame").addEventListener("click", async () => {
    if (busy) return;
    try {
      await newGame();
      $("#accuse").hidden = true;
      $("#auto").checked = game.auto_gossip;
      $("#begin").textContent = "Take the case";
      $("#opening").hidden = false;
      visit("mara", { arrive: true });
    } catch (e) { fail(e); }
  });
  $("#auto").addEventListener("change", async (e) => {
    try { game.auto_gossip = (await api("/api/settings", { player, auto_gossip: e.target.checked })).auto_gossip; }
    catch (err) { fail(err); }
  });
</script>
</body>
</html>
